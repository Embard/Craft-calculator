<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Книга крафта — Грань Заката</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=33">
</head>
<body data-page="craft">
  <div class="bg-video" aria-hidden="true">
    <video class="bg-video__clip is-active" muted playsinline preload="auto" poster="img/bg/woods-night.jpg">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
    <video class="bg-video__clip" muted playsinline preload="auto">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
  </div>
  <div class="atmosphere-haze"></div>
  <div class="tooltip" id="tooltip"></div>

  <header>
    <div class="mobile-compact-header">
      <a href="index.html"><img src="img/logo.png" alt="Logo" class="header-logo"></a>
      <span class="mobile-title">Грань Заката</span>
    </div>
    <div class="full-header" id="full-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Грань Заката" class="header-logo">
        <div class="brand-text">
          <h1>Грань Заката</h1>
        </div>
      </a>
    </div>
  </header>

  <main class="craft-book-stage">
    <section class="craft-book" aria-label="Книга крафта">
      <a href="index.html" class="craft-book__close" aria-label="Закрыть книгу">&times;</a>

      <div class="craft-book__shell">
        <div class="craft-book__rings" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="craft-book__sheet craft-book__sheet--index">
          <h1 class="craft-book__title">Книга<br>крафта</h1>
          <div class="search-row craft-book__search">
            <input id="craft-search" type="search" placeholder="Найти рецепт…">
          </div>
          <nav class="book-toc craft-toc" id="craft-chips" aria-label="Разделы крафта"></nav>
        </div>

        <div class="craft-book__sheet craft-book__sheet--work">
          <div class="item-grid craft-grid" id="catalog"></div>
          <div class="tree-wrap craft-tree" id="tree-root" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer>Помощник игроков сервера Грань Заката · PVE DayZ</footer>
  <script src="js/seed.js?v=6"></script>
  <script src="js/generated.js?v=6"></script>
  <script src="js/app.js?v=21"></script>
</body>
</html>
