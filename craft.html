<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крафт — Грань Заката</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="craft">
  <div class="campfire-glow"></div>
  <div class="sparks-container"></div>
  <div class="tooltip" id="tooltip"></div>

  <header>
    <div class="mobile-compact-header">
      <a href="index.html"><img src="img/logo.png" alt="Logo" class="header-logo"></a>
      <span class="mobile-title">Грань Заката</span>
      <button class="menu-toggle" onclick="toggleHeader()" aria-label="Меню"><span></span><span></span><span></span></button>
    </div>
    <div class="full-header" id="full-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Грань Заката" class="header-logo">
        <div class="brand-text">
          <h1>Грань Заката</h1>
          <span class="brand-badge">Справочник выжившего</span>
        </div>
      </a>
      <nav>
        <a href="index.html" class="link">Главная</a>
        <a href="craft.html" class="link active">Крафт</a>
        <a href="prices.html" class="link">Цены</a>
        <a href="https://грань-заката.рф" class="link external" target="_blank" rel="noopener">Основной сайт</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <section class="panel">
      <h2 class="panel-title">Гайды по крафту</h2>
      <div class="panel-body">
        <div class="search-row">
          <input id="craft-search" type="search" placeholder="Найти предмет...">
        </div>
        <div class="craft-layout">
          <div>
            <div class="info-label" style="margin-top:0">Предметы</div>
            <div class="catalog-list" id="catalog"></div>
          </div>
          <div class="tree-wrap" id="tree-root"></div>
          <div class="info-wrap" id="info-root"></div>
        </div>
      </div>
    </section>
  </div>

  <footer>Помощник игроков сервера Грань Заката · PVE DayZ</footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
