<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Предметы — Грань Заката</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="items">
  <div class="bg-video" aria-hidden="true">
    <video class="bg-video__clip is-active" muted playsinline preload="auto" poster="img/bg/woods-night.jpg">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
    <video class="bg-video__clip" muted playsinline preload="auto">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
  </div>
  <div class="atmosphere-haze"></div>

  <header>
    <div class="mobile-compact-header">
      <a href="index.html"><img src="img/logo.png" alt="Logo" class="header-logo"></a>
      <span class="mobile-title">Грань Заката</span>
      <button class="menu-toggle" onclick="toggleHeader()" aria-label="Меню"><span></span><span></span><span></span></button>
    </div>
    <div class="full-header" id="full-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Грань Заката" class="header-logo">
        <div class="brand-text">
          <h1>Грань Заката</h1>
          <span class="brand-badge">Справочник выжившего</span>
        </div>
      </a>
      <nav>
        <a href="index.html" class="link">Главная</a>
        <a href="items.html" class="link active">Предметы</a>
        <a href="craft.html" class="link">Крафт</a>
        <a href="prices.html" class="link">Цены</a>
        <a href="https://грань-заката.рф" class="link external" target="_blank" rel="noopener">Основной сайт</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div id="catalog-status" class="status-bar"></div>
    <section class="panel">
      <h2 class="panel-title">Каталог предметов</h2>
      <div class="panel-body">
        <div class="search-row">
          <input id="items-search" type="search" placeholder="Введите предмет или classname...">
          <div id="items-count" class="items-count"></div>
        </div>
        <div class="chips" id="items-chips"></div>
        <div class="item-grid" id="items-grid"></div>
        <button type="button" class="btn items-more" id="items-more" hidden>Показать ещё</button>
      </div>
    </section>
  </div>

  <div class="itemdb-modal" id="item-modal">
    <div class="itemdb-modal-inner">
      <div class="itemdb-modal-head">
        <div id="m-media" class="modal-media"></div>
        <div>
          <h2 id="m-title">—</h2>
          <div class="sub" id="m-sub">—</div>
        </div>
        <button class="close" type="button" onclick="closeItemModal()">✕</button>
      </div>
      <div class="itemdb-modal-body" id="m-body"></div>
    </div>
  </div>

  <footer>Помощник игроков сервера Грань Заката · PVE DayZ</footer>
  <script src="js/seed.js"></script>
  <script src="js/generated.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
