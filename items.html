<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог предметов — Грань Заката</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260919140429">
</head>
<body data-page="items">
  <div class="bg-video" aria-hidden="true">
    <video class="bg-video__clip is-active" muted playsinline preload="auto" poster="img/bg/woods-night.jpg">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
    <video class="bg-video__clip" muted playsinline preload="auto">
      <source src="img/bg/woods-night.mp4" type="video/mp4">
    </video>
  </div>
  <div class="atmosphere-haze"></div>
  <div class="tooltip tooltip--rich" id="tooltip"></div>

  <header>
    <div class="mobile-compact-header">
      <a href="index.html"><img src="img/logo.png" alt="Logo" class="header-logo"></a>
      <span class="mobile-title">Грань Заката</span>
    </div>
    <div class="full-header" id="full-header">
      <a href="index.html" class="brand">
        <img src="img/logo.png" alt="Грань Заката" class="header-logo">
        <div class="brand-text">
          <h1>Грань Заката</h1>
        </div>
      </a>
    </div>
  </header>

  <main class="open-book-stage">
    <section class="open-book" aria-label="Каталог предметов">
      <a href="index.html" class="open-book__close" aria-label="Закрыть книгу">&times;</a>
      <div class="open-book__cover">
        <div class="open-book__spread">
          <div class="open-book__page open-book__page--left">
            <h1 class="open-book__toc-heading">Оглавление</h1>
            <div class="search-row open-book__search">
              <input id="items-search" type="search" placeholder="Найти…">
            </div>
            <nav class="book-toc" id="items-chips" aria-label="Разделы каталога"></nav>
          </div>

          <div class="open-book__gutter" aria-hidden="true"></div>

          <div class="open-book__page open-book__page--right">
            <div class="item-grid" id="items-grid"></div>
            <button type="button" class="btn items-more" id="items-more" hidden>Показать ещё</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="itemdb-modal" id="item-modal">
    <div class="itemdb-modal-inner">
      <div class="itemdb-modal-head">
        <div id="m-media" class="modal-media"></div>
        <div>
          <h2 id="m-title">—</h2>
          <div class="sub" id="m-sub">—</div>
        </div>
        <button class="close" type="button" onclick="closeItemModal()">✕</button>
      </div>
      <div class="itemdb-modal-body" id="m-body"></div>
    </div>
  </div>

  <footer>Помощник игроков сервера Грань Заката · PVE DayZ</footer>
  <script src="js/seed.js?v=6"></script>
  <script src="js/generated.js?v=20260919141529"></script>
  <script src="js/app.js?v=20260919141529"></script>
</body>
</html>
